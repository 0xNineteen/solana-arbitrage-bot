[package]
name = "client"
version = "0.1.0"
edition = "2021"

[lib]
name = "client"
path = "src/lib.rs"

[[bin]]
name = "main"
path = "src/main.rs"

[[bin]]
name = "tmp"
path = "src/tmp.rs"

[[bin]]
name = "setup_ata"
path = "src/setup/setup_ata.rs"

[[bin]]
name = "setup_open_orders"
path = "src/setup/setup_open_orders.rs"

[dependencies]
solana-sdk = "1.9.9"
anchor-spl = { version = "0.29.0", features = ["dex"] }
anchor-client = { version = "0.29.0", features = ["debug"] }
anchor-lang = "0.29.0"
tmp = { path = "../program/programs/tmp", features = ["no-entrypoint"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
spl-math = { version = "^0.1.0", features = ["no-entrypoint"] }
anyhow = "1.0.55"
rayon = "1.5.1"
ordered-float = "4.2.0"
uint = "^0.9.1"
arrayref = "0.3.6"
num_enum = "0.7.2"
clap = { version = "4.4.18", features = ["derive"] }
enum_dispatch = "0.3.7"
num-derive = "0.4.1"
num-traits = "0.2"
solana-program = "1.9.9"
spl-token = { version = "4.0.0", features = ["no-entrypoint"] }
spl-token-swap = { version = "3.0.0", features = ["no-entrypoint"] }
stable-swap-math = "^1.8.1"
thiserror = "1.0"
arbitrary = { version = "1.0", features = ["derive"], optional = true }
roots = { version = "0.0.8", optional = true }
log = "0.4"
env_logger = "0.11.0"
indicatif = "0.17.7"
sha2 = "0.10.2"
dyn-clone = "1.0"
lazy_static = "1.4.0"

[dev-dependencies]
solana-sdk = "1.9.9"
proptest = "1.0"
roots = "0.0.8"

[workspace]
